<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07130f" />
    <title>Table Tennis Bracket</title>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <main id="app" class="app-shell" aria-live="polite">
      <section class="splash">
        <div class="brand-mark" aria-hidden="true">
          <span class="paddle"></span>
          <span class="ball"></span>
        </div>
        <p class="eyebrow">TABLE TENNIS</p>
        <h1>Строим сетку</h1>
        <div class="loading-line"><span></span></div>
      </section>
    </main>
    <div id="sheet-root"></div>
    <div id="toast-root" class="toast-root" aria-live="assertive"></div>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
